spring.application.name=api
server.port=8080

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/moodvoice_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate сам добавит новые колонки эмоций в существующую таблицу records
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Лимит на загрузку аудиофайлов
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Адрес FastAPI ML-сервиса
ml.service.url=http://localhost:8000

# Cloudinary (значения лучше задавать через переменные окружения, а не коммитить в Git)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dpvr9y8d7}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.config.import=optional:file:.env[.properties],optional:file:Backend/.env[.properties]

app.audio.storage-dir=uploads/audio
app.aes.secret-key=${AES_SECRET_KEY:TW9vZFZvaWNlMjAyNlNlY3VyZUFFUzI1NktleUZvckF1ZGlvIQ==}

app.jwt.secret=${JWT_SECRET:TW9vZFZvaWNlMjAyNkpXVFNlY3JldEtleUZvckF1dGhlbnRpY2F0aW9uIQ==}
app.jwt.expiration-ms=86400000